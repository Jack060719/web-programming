<!DOCTYPE html> <!-- 宣告文件類型為 HTML5 -->
<html lang="zh-Hant"> <!-- 設定網頁語言為繁體中文 -->
<head> <!-- 網頁標頭區開始 -->
  <meta charset="UTF-8"> <!-- 設定網頁編碼為 UTF-8，避免中文亂碼 -->
  <title>DOM 集合屬性存取範例</title> <!-- 設定瀏覽器分頁標題 -->
  <script> // 開始撰寫 JavaScript 程式碼
  function check() { // 定義存取 DOM 集合屬性的函式
      let n = document.images.length; // 取得目前文件中 <img> 物件的總數
      document.myform.result.value = "images物件的數目 : " + n // 輸出 images 集合總數
          + "\nimage1的圖片寬度 : " + document.images[0].width // 透過索引 0 取得第一張圖片的 width 屬性
          + "\nimage2的邊框寬度 : " + document.images["myimg2"].border // 透過名稱 myimg2 取得第二張圖片的 border 屬性
          + "\nimage3的名稱 : " + document.images["myimg3"].name // 透過名稱 myimg3 取得第三張圖片的 name 屬性
          + "\n超連結的href : " + document.links.item(0).href; // 透過 links 集合取得第一個超連結的 href 屬性
  } // 結束 check 函式
  </script> <!-- 結束 JavaScript 區塊 -->
</head> <!-- 網頁標頭區結束 -->
<body> <!-- 網頁主要內容區開始 -->
  <form name="myform"> <!-- 建立名為 myform 的表單 -->
    <textarea name="result" rows="6" cols="60"></textarea><br> <!-- 建立顯示結果的多行文字方塊並換行 -->
    <input type="button" value="存取images物件屬性" name="mybtn" onclick="check()"> <!-- 建立按鈕，點擊時執行 check() -->
  </form> <!-- 結束表單 -->
  <img src="images/01.jpg" width="100" border="0" name="myimg1" alt="圖片1"> <!-- 第一張圖片（索引 0，名稱 myimg1） -->
  <img src="images/02.jpg" width="150" border="0" name="myimg2" alt="圖片2"> <!-- 第二張圖片（索引 1，名稱 myimg2） -->
  <img src="images/03.jpg" width="200" border="0" name="myimg3" alt="圖片3"> <!-- 第三張圖片（索引 2，名稱 myimg3） -->
  <a href="https://www.google.com/">GOOGLE</a> <!-- 超連結物件（會被收錄在 document.links 集合） -->
</body> <!-- 網頁主要內容區結束 -->
</html> <!-- 結束整份 HTML 文件 -->
