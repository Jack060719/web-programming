<!DOCTYPE html> <!-- 宣告文件類型為 HTML5 -->
<html lang="zh-Hant"> <!-- 設定網頁語言為繁體中文 -->
<head> <!-- 網頁標頭區開始 -->
  <meta charset="UTF-8"> <!-- 設定網頁編碼為 UTF-8 -->
  <title>檢視物件 style 屬性範例</title> <!-- 設定瀏覽器分頁標題 -->
  <script> // 開始撰寫 JavaScript 程式碼
  function showStyle(txtStyle) { // 定義函式，接收目標元素物件 txtStyle
      let styleValue = ""; // 初始化儲存樣式清單的字串變數
      for (let i in txtStyle.style) { // 走訪 txtStyle.style 中的所有可列舉屬性名稱 i
          styleValue += i + ": " + txtStyle.style[i] + "\n"; // 串接屬性名稱、對應值與換行符號
      } // 結束 for...in 迴圈
      document.myForm.txtArea.value = styleValue; // 將結果輸出到表單 myForm 的 txtArea 多行文字方塊
  } // 結束 showStyle 函式
  </script> <!-- 結束 JavaScript 區塊 -->
</head> <!-- 網頁標頭區結束 -->
<body> <!-- 網頁主要內容區開始 -->
  <p id="targetText" style="color: blue; font-size: 18px;">這是一段測試文字</p> <!-- 設定行內樣式的目標段落 -->
  <button type="button" onclick="showStyle(document.getElementById('targetText'))">檢視樣式</button> <!-- 點擊後將段落元素傳入 showStyle() -->
  <form name="myForm"> <!-- 建立名為 myForm 的表單 -->
    <br> <!-- 換行 -->
    <textarea name="txtArea" rows="10" cols="50"></textarea> <!-- 建立顯示 style 屬性的多行文字方塊 -->
  </form> <!-- 結束表單 -->
</body> <!-- 網頁主要內容區結束 -->
</html> <!-- 結束整份 HTML 文件 -->
