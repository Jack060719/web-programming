<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  div {
    margin: 10px;         /* 外距：與外部元素距離 10px */
    padding: 10px;        /* 內距：文字與邊框距離 10px */
    border-width: 10px;   /* 邊框寬度：10px */
    border-style: solid;  /* 必須加上樣式，邊框才會顯示出來 */
  }
</style>
</head>
<body>

  <div>這是一個 div 區塊</div>

</body>
</html>
