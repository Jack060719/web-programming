<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  div {
    width: 300px;
    height: 120px;
    background-color: #ffffcc;

    /* 1. 先清除所有邊框，避免受到瀏覽器預設影響 */
    border: none;

    /* 2. 精準指定「上邊框」：4px 寬、雙線 (double)、藍色 (#3300FF) */
    border-top: 4px double #3300FF;

    /* 3. 內部留白與外部距離 */
    padding-top: 25px;
    padding-left: 20px;
    margin: 30px;
  }
</style>
</head>
<body>

  <div>這是一個測試區塊</div>

</body>
</html>
